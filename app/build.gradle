plugins {
    id 'com.android.application'
}

def npVersion = (project.findProperty('newpipeVersion') ?: 'v0.27.1').toString()
def media3 = '1.5.1'

android {
    namespace 'uz.tinglaymiz.app'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.tinglaymiz.app'
        // Android 5.0 (API 21) va undan yuqori versiyalar
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'NP_VERSION', "\"${npVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // NewPipeExtractor 0.27 dan boshlab Java 17 talab qiladi
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/LICENSE.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE.md',
                'META-INF/INDEX.LIST'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    implementation 'androidx.core:core:1.13.1'
    implementation "androidx.media3:media3-exoplayer:${media3}"
    implementation "androidx.media3:media3-exoplayer-hls:${media3}"
    implementation "androidx.media3:media3-session:${media3}"

    implementation "com.github.TeamNewPipe:NewPipeExtractor:${npVersion}"
}
